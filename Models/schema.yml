version: 2

models:

  # =========================
  # STAGING
  # =========================

  - name: stg_salesorderheader
    description: "Staging do cabeçalho de pedidos de venda."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        tests:
          - not_null
          - unique

      - name: order_date
        description: "Data em que o pedido foi realizado."
        tests:
          - not_null

      - name: customer_id
        description: "Identificador do cliente."
        tests:
          - not_null

  - name: stg_salesorderdetail
    description: "Staging dos itens dos pedidos de venda."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        tests:
          - not_null

      - name: product_id
        description: "Identificador do produto."
        tests:
          - not_null


  # =========================
  # DIMENSÕES
  # =========================

  - name: dim_customer
    description: "Dimensão de clientes."
    columns:
      - name: customer_key
        description: "Chave do cliente."
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Dimensão de produtos."
    columns:
      - name: product_key
        description: "Chave do produto."
        tests:
          - not_null
          - unique

  - name: dim_status
    description: "Dimensão de status do pedido."
    columns:
      - name: status_key
        description: "Código do status do pedido."
        tests:
          - not_null
          - unique

  - name: dim_sales_reason
    description: "Dimensão de motivos da venda."
    columns:
      - name: sales_reason_key
        description: "Chave do motivo da venda."
        tests:
          - not_null
          - unique

  - name: dim_payment_method
    description: "Dimensão de métodos de pagamento."
    columns:
      - name: payment_method_key
        description: "Chave do método de pagamento."
        tests:
          - not_null
          - unique

  - name: dim_location
    description: "Dimensão de localização geográfica."
    columns:
      - name: location_key
        description: "Chave da localização."
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Dimensão de datas."
    columns:
      - name: date_key
        description: "Chave da data no formato YYYYMMDD."
        tests:
          - not_null
          - unique


  # =========================
  # FATOS
  # =========================

  - name: fct_sales
    description: "Tabela fato de vendas no nível de item por pedido."
    columns:
      - name: date_key
        description: "Chave da data."
        tests:
          - not_null

      - name: product_key
        description: "Chave do produto."
        tests:
          - not_null

      - name: customer_key
        description: "Chave do cliente."
        tests:
          - not_null

      - name: location_key
        description: "Chave da localização."
        tests:
          - not_null

      - name: status_key
        description: "Chave do status do pedido."
        tests:
          - not_null

      - name: payment_method_key
        description: "Chave do método de pagamento."
        tests:
          - not_null

      - name: quantity
        description: "Quantidade de itens vendidos."
        tests:
          - not_null

      - name: gross_amount
        description: "Valor bruto negociado."

  - name: fct_sales_reason
    description: "Tabela fato que relaciona pedidos aos motivos da venda."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        tests:
          - not_null

      - name: sales_reason_key
        description: "Chave do motivo da venda."
        tests:
          - not_null