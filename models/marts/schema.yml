version: 2

models:
  - name: fct_sales
    columns:
      - name: sales_key
        tests:
          - unique
          - not_null
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null